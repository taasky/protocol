name: publish

# Publishes to npm when a tag like v0.2.0 is pushed. No token: npm trusts this
# workflow through OIDC (trusted publishing), and attaches provenance that ties
# the package to the commit it was built from.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@latest
      - name: Tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          test "v$version" = "$GITHUB_REF_NAME" || {
            echo "tag $GITHUB_REF_NAME, but package.json says $version"; exit 1; }
      - run: npm ci
      - run: npm publish --access public
